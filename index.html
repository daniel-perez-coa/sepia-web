<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SEPIA está construyendo lo que sigue. Muy pronto lanzaremos nuestro nuevo sitio."
    />
    <meta name="theme-color" content="#030814" />
    <title>SEPIA — Work in progress</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #030814;
        --paper: #f7f3e8;
        --blue: #3158ff;
        --mint: #48deb0;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 52%, rgba(19, 42, 84, 0.16), transparent 36%),
          linear-gradient(130deg, #071020 0%, var(--ink) 64%);
        color: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100svh;
        align-items: center;
        padding: clamp(2rem, 5vw, 4.5rem);
        isolation: isolate;
      }

      .content {
        width: min(100%, 48rem);
        padding-bottom: clamp(4rem, 10vh, 7rem);
      }

      h1 {
        max-width: 8ch;
        margin: 0;
        font-size: clamp(4.2rem, 9.5vw, 8.75rem);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.9;
        text-wrap: balance;
      }

      .lead {
        margin: clamp(1.25rem, 3vw, 2rem) 0 0;
        color: var(--blue);
        font-size: clamp(1.35rem, 2.6vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .copy {
        margin: 1.5rem 0 0;
        font-size: clamp(1rem, 1.4vw, 1.25rem);
        line-height: 1.6;
      }

      .button {
        display: inline-flex;
        min-height: 3.5rem;
        align-items: center;
        gap: 2.5rem;
        margin-top: 2rem;
        padding: 0.95rem 1.4rem;
        background: var(--blue);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 180ms ease, background 180ms ease;
      }

      .button:hover {
        background: #4568ff;
        transform: translateY(-2px);
      }

      .button:focus-visible {
        outline: 3px solid var(--mint);
        outline-offset: 4px;
      }

      .button span {
        font-size: 1.6rem;
        font-weight: 400;
        line-height: 0;
      }

      .meta {
        position: absolute;
        bottom: clamp(2rem, 5vw, 4.5rem);
        left: clamp(2rem, 5vw, 4.5rem);
        margin: 0;
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .meta b {
        color: var(--blue);
      }

      .slashes {
        position: absolute;
        top: 11%;
        right: 5%;
        width: clamp(8rem, 17vw, 13rem);
        height: 2.5rem;
        background: repeating-linear-gradient(
          125deg,
          transparent 0 0.75rem,
          var(--blue) 0.75rem 1.35rem,
          transparent 1.35rem 2rem
        );
      }

      .dots {
        position: absolute;
        top: 47%;
        right: 12%;
        width: 5rem;
        height: 5rem;
        background-image: radial-gradient(circle, var(--blue) 0 2px, transparent 2.5px);
        background-size: 1.4rem 1.4rem;
      }

      .arc {
        position: absolute;
        right: -8rem;
        bottom: -10rem;
        width: clamp(18rem, 35vw, 32rem);
        aspect-ratio: 1;
        border: clamp(1rem, 2vw, 1.65rem) solid var(--mint);
        border-radius: 50%;
      }

      @media (max-width: 720px) {
        main {
          align-items: start;
          padding-top: clamp(4rem, 15vh, 7rem);
        }

        h1 {
          font-size: clamp(3.55rem, 18vw, 6rem);
        }

        .content {
          padding-bottom: 7rem;
        }

        .slashes {
          top: 2rem;
          right: 1.5rem;
          opacity: 0.8;
        }

        .dots {
          top: auto;
          right: 1rem;
          bottom: 11rem;
          opacity: 0.75;
        }

        .arc {
          right: -10rem;
          bottom: -11rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="slashes" aria-hidden="true"></div>
      <div class="dots" aria-hidden="true"></div>
      <div class="arc" aria-hidden="true"></div>

      <section class="content" aria-labelledby="page-title">
        <h1 id="page-title">WORK IN PROGRESS</h1>
        <p class="lead">Estamos construyendo lo que sigue.</p>
        <p class="copy">Muy pronto lanzaremos nuestro nuevo sitio.</p>
        <a
          class="button"
          href="https://www.tiktok.com/@soyeldano"
          target="_blank"
          rel="noreferrer"
        >
          Ver TikTok <span aria-hidden="true">→</span>
        </a>
      </section>

      <p class="meta">PUEBLA_MX <b>/</b> CREATIVE MAKER STUDIO</p>
    </main>
  </body>
</html>
